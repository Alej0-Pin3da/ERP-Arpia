[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 is ignored because FastAPI's dependency-injection pattern relies on
# callables in default values (e.g. `session: Session = Depends(get_db)`).
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# E402: these modules deliberately bootstrap sys.path / env vars before imports.
"passenger_wsgi.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"scripts/prune_tokens.py" = ["E402"]
